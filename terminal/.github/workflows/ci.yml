name: Build and Smoke Test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -std=gnu++17 -O2 -Wall -Wextra mini_fs.cpp -o mini_fs
      - name: Smoke test
        run: printf 'help\nexit\n' | ./mini_fs > /dev/null
